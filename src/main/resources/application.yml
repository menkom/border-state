server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
spring:
  application.name: ${APPLICATION_NAME:border-state-collector}
  datasource:
    url: ${DATASOURCE_URL:}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    change-log: classpath:/db/changelog/master.yaml
    default-schema: border_state_db
    enabled: true
feign:
  client:
    config:
      default:
        loggerLevel: basic

border-waiting-area:
  scheduler:
    data-collection:
      checkpoints-update: ${CHECKPOINTS_UPDATE:86400000}
      states-update: ${STATES_UPDATE:15000}
  enable-json-log: ${LOG_IN_JSON:true}
  bot:
    url: ${BORDER_WAITING_AREA_URL:http://host.docker.internal:8088}
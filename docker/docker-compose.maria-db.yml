version: '3.8'

name: mariadb-container

services:
  maria-db:
    image: jbergstroem/mariadb-alpine:10.11.5
    container_name: border-state-collector-maria-db
    env_file:
      - ./.mariadb.env
    ports:
      - '3306:3306'
    restart: on-failure
    volumes:
      - border-state-collector-maria-db:/var/lib/postgresql/data
      - ./init/:/docker-entrypoint-initdb.d/

volumes:
  border-state-collector-maria-db:
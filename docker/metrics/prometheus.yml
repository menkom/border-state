global:
  scrape_interval: 5s

scrape_configs:

  - job_name: 'envy'
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: 'car-statistics-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          instance: 'localhost-car-statistics-app'
          app: 'car-statistics-app'
  - job_name: 'border-collector'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['192.168.1.102:8080']
        labels:
          instance: 'envy-border-state-collector-app'
          app: 'border-state-collector-app'
  - job_name: 'car-statistics-app-collector'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['192.168.1.37:8980']
        labels:
          instance: 'envy-instance'
          app: 'car-statistics-app'